AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NovaTarget research-agent API

Parameters:
  BrightDataApiToken:
    Type: String
    NoEcho: true
    Description: Bright Data API token. Pass at deployment time; never commit it.
  BrightDataZone:
    Type: String
    Description: Name of the configured Bright Data Web Unlocker zone.
  StrandsBedrockModelId:
    Type: String
    Default: ''
    Description: Optional Amazon Bedrock model ID for Strands research synthesis. Leave blank to use the SDK default.

Resources:
  NovaTargetApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [Content-Type]
        AllowOrigins: ['*']

  ResearchAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: src/handler.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ALLOWED_ORIGIN: '*'
          BRIGHT_DATA_API_TOKEN: !Ref BrightDataApiToken
          BRIGHT_DATA_ZONE: !Ref BrightDataZone
          STRANDS_BEDROCK_MODEL_ID: !Ref StrandsBedrockModelId
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: '*'
      Events:
        Score:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaTargetApi
            Path: /score
            Method: POST
        Evidence:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaTargetApi
            Path: /evidence
            Method: POST
        Research:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaTargetApi
            Path: /research
            Method: POST
